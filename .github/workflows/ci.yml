name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint, types, unit tests
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  windows-build:
    name: build installer and run end-to-end tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm build:win
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        with:
          name: jobowl-installer
          path: dist/jobowl-*-setup.exe
